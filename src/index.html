<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Tech Summit 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NYC Tech Summit 2026</h1>
        <p>March 15, 2026 | 9:00 AM - 5:00 PM | Manhattan Conference Center</p>
    </header>

    <main>
        <section>
            <h2>Event RSVP</h2>

            <form>
                <div class="row">
                    <div class="RSVP">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div class="RSVP">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                </div>

                <div class="row">
                    <div class="RSVP">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="RSVP">
                        <label for="number-of-tickets">Number of Tickets</label>
                        <input type="number" id="number-of-tickets" name="number-of-tickets" value="1" min="1">
                    </div>
                </div>

                <fieldset id="lunch-options">
                    <legend>Lunch Preference</legend>

                    <div class="option">
                        <input type="radio" name="lunch-preference" value="chicken">
                        <label for="chicken-option">Chicken</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="lunch-preference" value="fish">
                        <label for="fish-option">Fish</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="lunch-preference" value="vegetarian">
                        <label for="vegetarian-option">Vegetarian</label>
                    </div>
                </fieldset>

                <fieldset id="workshop-sessions">
                    <legend>Select Workshop Sessions (Check all that apply)</legend>

                    <div class="option">
                        <input type="checkbox" class="workshop-selection" name="workshop-sessions" value="session-1">
                        <label for="session-1">Session 1</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" class="workshop-selection" name="workshop-sessions" value="session-2">
                        <label for="session-2">Session 2</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" class="workshop-selection" name="workshop-sessions" value="session-3">
                        <label for="session-3">Session 3</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" class="workshop-selection" name="workshop-sessions" value="session-4">
                        <label for="session-4">Session 4</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" class="workshop-selection" name="workshop-sessions" value="session-5">
                        <label for="session-5">Session 5</label>
                    </div>
                </fieldset>

                <div class="RSVP">
                    <label for="special-requests">Special Requests or Notes</label>
                    <textarea id="special-requests" name="special-requests" placeholder="Dietary restrictions, accessibility needs, questions, etc."></textarea>
                </div>

                <button type="submit">Complete RSVP</button>
            </form>
        </section>
    </main>

    <footer>
        Copyright © 2026 NYC Tech Summit
    </footer>
</body>
</html>
