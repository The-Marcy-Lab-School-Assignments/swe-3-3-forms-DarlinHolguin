<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>
            NYC Tech Summit 2026
        </h1>
        <p>March 15, 2025 | 9:00 AM - 5:00 PM | Manhattan Conference Center</p>
    </header>
    <main>
        <section>
            <h2>Event RSVP</h2>

            <form>
                <div>
                    <label for="first-name">First Name</label>
                    <input type="text" id="First-name">
                </div>

                <div>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="Last-name">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>

                <div>
                    <label for="num-of-tickets">Number of Tickets</label>
                    <input type="number" id="num-of-tickets" >
                </div>
            </form>

            <fieldset>
                <legend>Lunch Preference</legend>

                <input type="radio" id="chicken-option">
                <label for="chicken-option">Chicken</label>
            </fieldset>

        </section>

    </main>

    <footer>

    </footer>
</body>
</html>
